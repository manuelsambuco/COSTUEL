<defs>
  {# Stessa sfumatura di --accent-gradient: chiaro in alto, scuro in basso.
     L'SVG è ruotato di -90°, quindi il suo asse x punta verso l'alto: si va da x=1 (alto) a x=0 (basso). #}
  <linearGradient id="ring-gradient" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0%" style="stop-color: var(--accent-light)" />
    <stop offset="55%" style="stop-color: var(--accent)" />
    <stop offset="100%" style="stop-color: var(--accent-deep)" />
  </linearGradient>
</defs>
