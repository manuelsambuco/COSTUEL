{% extends "challenge/base.html" %}

{% block content %}
  <div id="board">
    {% include "challenge/_board.html" %}
  </div>

  <section class="card push-card" id="push-card" hidden>
    <div class="push-text">
      <strong id="push-title">Notifiche</strong>
      <p class="muted" id="push-desc"></p>
    </div>
    <div class="push-actions">
      <button type="button" class="btn btn-small" id="push-enable" hidden>Attiva notifiche</button>
      <button type="button" class="btn btn-small btn-ghost" id="push-test" hidden>Prova</button>
      <button type="button" class="link-btn" id="push-disable" hidden>Disattiva</button>
    </div>
  </section>
{% endblock %}
