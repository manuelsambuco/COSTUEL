{% extends "challenge/base.html" %}

{% block title %}Cambia password · COSTUEL{% endblock %}

{% block content %}
  <div class="page-head">
    <a href="{% url 'profile' %}" class="back" aria-label="Torna al profilo">‹</a>
    <h1 class="page-title">Cambia password</h1>
  </div>

  <section class="card">
    <form method="post" class="form" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <label>{{ field.label }}
          <input type="password" name="{{ field.html_name }}" required
                 autocomplete="{% if field.name == 'old_password' %}current-password{% else %}new-password{% endif %}">
          {% if field.errors %}<span class="form-error">{{ field.errors|join:" " }}</span>{% endif %}
        </label>
      {% endfor %}
      <p class="muted small">Almeno 8 caratteri, non troppo semplice e non solo numeri.</p>
      <button type="submit" class="btn btn-block">Salva la nuova password</button>
    </form>
  </section>
{% endblock %}
